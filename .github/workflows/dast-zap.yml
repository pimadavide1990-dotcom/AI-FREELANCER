name: DAST - OWASP ZAP Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application with OWASP ZAP
    
    # Definiamo l'app come servizio affinché sia attiva e raggiungibile in localhost
    services:
      web:
        image: node:18-alpine
        ports:
          - 3000:3000
        # Se la tua app si trova in una cartella specifica, adatta i comandi di conseguenza
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa dipendenze e avvia l'app nel servizio
        run: |
          cd backend
          npm install
          npm start &
          sleep 5
        
      - name: Esecuzione OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          allow_issue_writing: false
          fail_action: false